
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Coins</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #10172a, #263c67);
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 25px;
        color: #ffd166;
    }

    #game {
        position: relative;
        width: min(90vw, 400px);
        height: 500px;
        margin: 20px auto;
        background: linear-gradient(#79d5ff, #e4f8ff);
        border: 4px solid white;
        border-radius: 16px;
        overflow: hidden;
    }

    #player {
        position: absolute;
        bottom: 15px;
        left: 165px;
        width: 65px;
        height: 55px;
        background: #2463eb;
        border-radius: 12px;
        font-size: 35px;
        line-height: 55px;
        user-select: none;
    }

    .coin {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #ffcc33;
        color: #805600;
        border: 3px solid #f5a623;
        line-height: 24px;
        font-weight: bold;
        text-align: center;
    }

    #score {
        font-size: 22px;
        font-weight: bold;
    }

    button {
        padding: 12px 24px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        background: #ffd166;
        color: #182039;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(.95);
    }

    #message {
        font-weight: bold;
        color: #ffd166;
    }
</style>
</head>

<body>

<h1>🪙 Catch the Coins!</h1>
<p>Use ← → or A / D to move.</p>
<p id="score">Score: 0</p>

<div id="game">
    <div id="player">🧺</div>
</div>

<p id="message">Catch as many coins as you can!</p>
<button onclick="startGame()">Start / Restart</button>
<button onclick="move(-1)">⬅ Left</button>
<button onclick="move(1)">Right ➡</button>

<script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const scoreText = document.getElementById("score");
    const message = document.getElementById("message");

    let x = 165;
    let score = 0;
    let running = false;
    let coins = [];
    let timer;
    let spawnTimer;

    function move(direction) {
        if (!running) return;
        x += direction * 30;
        x = Math.max(0, Math.min(game.clientWidth - 65, x));
        player.style.left = x + "px";
    }

    document.addEventListener("keydown", function(e) {
        if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
            move(-1);
        }
        if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
            move(1);
        }
    });

    function spawnCoin() {
        const coin = document.createElement("div");
        coin.className = "coin";
        coin.textContent = "$";
        coin.style.left =
            Math.random() * (game.clientWidth - 30) + "px";
        coin.style.top = "0px";
        game.appendChild(coin);

        coins.push({ element: coin, y: 0 });
    }

    function startGame() {
        clearInterval(timer);
        clearInterval(spawnTimer);

        coins.forEach(c => c.element.remove());
        coins = [];
        score = 0;
        x = (game.clientWidth - 65) / 2;
        player.style.left = x + "px";
        scoreText.textContent = "Score: 0";
        message.textContent = "Catch the coins!";
        running = true;

        spawnTimer = setInterval(spawnCoin, 850);

        timer = setInterval(() => {
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.y += 4 + Math.min(score * 0.1, 5);
                c.element.style.top = c.y + "px";

                const coinLeft = parseFloat(c.element.style.left);
                const caught =
                    c.y + 30 >= game.clientHeight - 70 &&
                    c.y <= game.clientHeight - 15 &&
                    coinLeft + 30 > x &&
                    coinLeft < x + 65;

                if (caught) {
                    score++;
                    scoreText.textContent = "Score: " + score;
                    c.element.remove();
                    coins.splice(i, 1);
                } else if (c.y > game.clientHeight) {
                    c.element.remove();
                    coins.splice(i, 1);
                }
            }
        }, 25);
    }
</script>

</body>
</html>
